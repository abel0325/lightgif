name: Windows build and GIF encoder tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build x86 application and tests
        shell: pwsh
        run: ./build.ps1 -Tests
      - name: Independent GIF decoder tests (no installed fonts required)
        shell: pwsh
        run: |
          python -m pip install -r tests/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency install failed' }
          New-Item -ItemType Directory -Path build/ci-tests -Force | Out-Null
          Set-Location build/ci-tests
          & ../encoder_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Encoder tests failed' }
          python ../../tests/validate.py
          if ($LASTEXITCODE -ne 0) { throw 'Independent decoder checks failed' }
